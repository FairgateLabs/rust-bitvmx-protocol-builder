[package]
name = "bitvmx-protocol-builder"
description = "Library to build and manage Directed Acyclic Graphs (DAGs) of BitVMX pre-signed transactions"
version = "0.8.4"
edition = "2021"
authors = ["Diego Masini <diego.masini@gmail.com>"]
repository = "https://github.com/FairgateLabs/rust-bitvmx-protocol-builder"

[lib]
name = "protocol_builder"

[dependencies]
anyhow = "1.0.104"
bitcoin = { version = "0.32.102", features = ["std", "rand-std"] }
clap = { version = "4.6.6", features = ["derive"] }
config = "0.15.25"
hex = "0.4.3"
itertools = "0.15.0"
musig2 = { version = "0.4.1", features = ["secp256k1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
petgraph = { version = "0.8.3", features = ["serde-1"] }

bitcoincore-rpc = { version = "0.19.0" }

bitcoin-script = { git = "https://github.com/FairgateLabs/rust-bitcoin-script/", tag = "v0.6.0" }
bitcoin-scriptexec = { git = "https://github.com/FairgateLabs/rust-bitcoin-scriptexec/", tag = "v0.6.0" }

bitvmx-key-manager = { git = "https://github.com/FairgateLabs/rust-bitvmx-key-manager.git", tag = "v0.8.4" }
bitvmx-bitcoin-rpc = { git = "https://github.com/FairgateLabs/rust-bitvmx-bitcoin-rpc.git", tag = "v0.8.4" }
rust-bitvmx-storage-backend = { git = "https://github.com/FairgateLabs/rust-bitvmx-storage-backend.git", tag = "v0.8.4" }
bitvmx-settings = { git = "https://github.com/FairgateLabs/rust-bitvmx-settings.git", tag = "v0.8.4" }
bitcoin-script-stack = { git = "https://github.com/FairgateLabs/rust-bitcoin-script-stack.git", tag = "v0.6.0" }
bitcoin-script-functions = { git = "https://github.com/FairgateLabs/rust-bitcoin-script-functions.git", tag = "v0.6.0" }
redact = { version = "0.1", features = ["serde", "zeroize"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bin]]
name = "protocol_builder"
path = "src/main.rs"

[[bench]]
name = "sighash_bench"
harness = false
